data:
  transactions_path: data/raw/transactions_train.csv
  articles_path: data/raw/articles.csv

split:
  validation_days: 7

interaction_weighting:
  method: recency
  lambda: 0.01

hybrid:
  embedding_dim: 128
  user_id_embedding_dim: 64
  item_id_embedding_dim: 64
  categorical_embedding_dim: 16
  history_length: 20
  learning_rate: 0.001
  batch_size: 2048
  epochs: 3
  temperature: 0.05
  random_state: 42

retrieval:
  candidate_k: 200
  filter_seen: true

evaluation:
  ks: [12, 50, 100, 200]
  progress_log_interval_sec: 1800
  user_chunk_size: 5000

artifacts:
  model_dir: artifacts/hybrid
  mappings_dir: data/mappings

popularity:
  rank_by: purchase_count

ranking:
  max_train_users: 50000
  negatives_per_positive: 5
  random_state: 42
  model_path: artifacts/hybrid/ranker/ranker.pkl
  lgbm:
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 20
    subsample: 0.8
    colsample_bytree: 0.8
