workerPoolSpecs:
  - machineSpec:
      machineType: n1-highmem-16
    replicaCount: 1
    containerSpec:
      imageUri: asia-south1-docker.pkg.dev/rec-sys-507218/recsys/recsys-hybrid-training:v1
      env:
        - name: TRANSACTIONS_PATH
          value: gs://rec-sys-507218-data/data/raw/transactions_train.csv
        - name: ARTICLES_PATH
          value: gs://rec-sys-507218-data/data/raw/articles.csv
        - name: OUTPUT_URI
          value: gs://rec-sys-507218-data/artifacts/hybrid_job_output
        - name: CONFIG_PATH
          value: /app/configs/hybrid.yaml
baseOutputDirectory:
  outputUriPrefix: gs://rec-sys-507218-data/artifacts/hybrid_job_output
